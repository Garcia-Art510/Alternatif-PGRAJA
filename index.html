<!DOCTYPE html>

<html lang="id">

<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Space Landing Page"
>

<title>Space Landing Page</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- =====================================================
     SPACE BACKGROUND
====================================================== -->

<div class="space-background">

    <!-- PNG BACKGROUND -->
    <div class="background-image"></div>

    <!-- DARK OVERLAY -->
    <div class="background-overlay"></div>


    <!-- =================================================
         STARS
    ================================================== -->

    <div class="stars stars-1"></div>
    <div class="stars stars-2"></div>
    <div class="stars stars-3"></div>


    <!-- =================================================
         PARTICLES
    ================================================== -->

    <div id="particles"></div>


    <!-- =================================================
         ASTEROIDS
    ================================================== -->

    <div class="asteroid asteroid-1"></div>

    <div class="asteroid asteroid-2"></div>

    <div class="asteroid asteroid-3"></div>


    <!-- =================================================
         LIGHTNING
    ================================================== -->

    <div class="lightning lightning-1"></div>

    <div class="lightning lightning-2"></div>

</div>



<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="container">


    <!-- =================================================
         LOGO
    ================================================== -->

    <div class="logo-wrapper">

        <img
            src="./LOGO PGRAJA.png"
            alt="Logo"
            class="main-logo"
        >

    </div>



    <!-- =================================================
         BUTTON AREA
    ================================================== -->

    <div class="button-area">


        <!-- LEFT COLUMN -->

        <div class="button-column">


            <!-- LOGIN -->

            <a
                href="https://pgraja-pc.com/"
                class="space-button login-button"
            >

                <span>LOGIN</span>

            </a>



            <!-- LIVE CHAT -->

            <a
                href="https://app.chaport.com/widget/show.html?appid=67c1cbd72bcd7cfe08e52846"
                class="space-button chat-button"
            >

                <span>LIVE CHAT</span>

            </a>

        </div>



        <!-- RIGHT COLUMN -->

        <div class="button-column">


            <!-- DAFTAR -->

            <a
                href="https://pgraja-pc.com/register?ref=K3MDOAC000J"
                class="space-button register-button"
            >

                <span>DAFTAR</span>

            </a>



            <!-- RTP -->

            <a
                href="http://rtppgraja.com"
                class="space-button rtp-button"
            >

                <span>RTP</span>

            </a>

        </div>

    </div>



    <!-- =================================================
         NOTE BOX
    ================================================== -->

    <div class="note-box">


        <div class="note-title">

            <span>⚡</span>

            <span>NOTE</span>

        </div>



        <div class="note-content">

            Pastikan Anda selalu menggunakan link resmi.
            Jangan memberikan username, password, OTP,
            atau informasi pribadi kepada pihak lain.

        </div>


    </div>


</main>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="script.js"></script>
```

</body>

</html>
